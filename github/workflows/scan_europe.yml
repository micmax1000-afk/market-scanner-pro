name: Scanner Automatico - Mercati Europei

on:
  schedule:
    # 08:00 UTC = 10:00 ora italiana quando è in vigore l'ora legale
    # (CEST, UTC+2 — da fine marzo a fine ottobre, che copre quasi
    # tutto il periodo di mercato attivo). Durante l'ora solare (CET,
    # UTC+1 — da fine ottobre a fine marzo) l'orario reale sarà 11:00
    # anziché 10:00: se vuoi precisione assoluta tutto l'anno, in
    # inverno cambia "0 8" in "0 9" qui sotto (vedi README).
    - cron: '0 8 * * 1-5'
  workflow_dispatch: {}  # permette di lanciarlo manualmente da GitHub per test

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Esegui lo scanner Europa (Giornaliero + 4 Ore)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scheduled_scan.py --market europe
