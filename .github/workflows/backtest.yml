name: Backtest realistico

# Testa le strategie di strategies_pro.py su 20 anni di dati veri e salva
# i risultati in results/pro_results.json sullo stesso branch.
# (Il backtest delle strategie vecchie si lancia a mano con
#  python run_backtest.py: i suoi risultati sono in results/backtest_results.json.)
# Parte da solo quando cambiano i file del backtest, oppure a mano da
# GitHub (Actions -> Backtest realistico -> Run workflow).

on:
  push:
    paths:
      - 'strategies_pro.py'
      - 'run_pro_backtest.py'
      - '.github/workflows/backtest.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: backtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Esegui il backtest delle strategie (20 anni)
        run: python run_pro_backtest.py --period 20y --out results/pro_results.json

      - name: Salva i risultati nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/pro_results.json
          git commit -m "Risultati backtest strategie ($(date -u +%Y-%m-%d))" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
